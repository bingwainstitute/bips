<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>News & Announcements – BIPS</title>
<meta name="description" content="Latest news and announcements from Bingwa Institute of Professional Studies.">
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="container"><h1>News & Announcements</h1><p>Stay up to date with what's happening at BIPS.</p></div></div>
<section class="section"><div class="container"><div class="grid g3" id="list"><div style="grid-column:1/-1">Loading…</div></div></div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  await pageInit("news.html");
  if (!CONFIGURED) { $("#list").innerHTML = ""; return; }
  const { data } = await sb.from("announcements").select("*").eq("published", true).order("created_at", { ascending: false });
  $("#list").innerHTML = (data || []).map(n => `
    <article class="card news-card">${n.image_url ? `<img src="${esc(n.image_url)}" alt="" loading="lazy">` : ""}
      <div class="card-body"><span class="date">${fmtDate(n.created_at)}</span><h3>${esc(n.title)}</h3><p>${esc(n.body || "")}</p></div></article>`).join("") || `<div class="empty" style="grid-column:1/-1">No announcements yet. Check back soon.</div>`;
})();
</script>
</body></html>
