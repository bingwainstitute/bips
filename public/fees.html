<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fees Structure – BIPS</title>
<meta name="description" content="Course fees at Bingwa Institute of Professional Studies. Affordable tuition for certificate, diploma and short courses.">
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="container"><h1>Fees Structure</h1><p>Affordable fees for quality, practical training.</p></div></div>
<section class="section"><div class="container">
  <div class="alert alert-info" id="note" style="display:none"></div>
  <div class="filters"><input type="search" id="q" placeholder="Search a course…"><select id="dept"><option value="">All departments</option></select></div>
  <div class="table-wrap"><table class="t"><thead><tr><th>Course</th><th>Department</th><th>Level</th><th>Duration</th><th>Tuition fee</th><th></th></tr></thead><tbody id="rows"><tr><td colspan="6">Loading…</td></tr></tbody></table></div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  const s = await pageInit("fees.html");
  if (s.fees_note) { $("#note").style.display = "block"; $("#note").textContent = s.fees_note; }
  if (!CONFIGURED) return;
  const [{ data: depts }, { data: courses }] = await Promise.all([
    sb.from("departments").select("*").order("sort_order"),
    sb.from("courses").select("*").eq("is_active", true).order("name"),
  ]);
  const dn = Object.fromEntries((depts || []).map(d => [d.id, d.name]));
  $("#dept").innerHTML += (depts || []).map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join("");
  function render() {
    const q = $("#q").value.toLowerCase(), d = $("#dept").value;
    const f = (courses || []).filter(c => (!d || c.department_id === d) && (!q || c.name.toLowerCase().includes(q)));
    $("#rows").innerHTML = f.map(c => `<tr><td><b>${esc(c.name)}</b></td><td>${esc(dn[c.department_id] || "")}</td><td>${esc(c.level)}</td><td>${esc(c.duration || "TBC")}</td>
      <td><b>${esc(money(c.fee) || "To be confirmed")}</b></td><td><a class="btn btn-gold btn-sm" href="apply.html?course=${c.id}">Apply</a></td></tr>`).join("") || `<tr><td colspan="6" class="center muted">No courses found.</td></tr>`;
  }
  $("#q").addEventListener("input", render); $("#dept").addEventListener("input", render); render();
})();
</script>
</body></html>
