<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact Us – BIPS</title>
<meta name="description" content="Contact Bingwa Institute of Professional Studies: phone, email, location and enquiry form.">
<link rel="icon" type="image/png" href="assets/favicon.png"><link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
<div class="page-hero"><div class="container"><h1>Contact Us</h1><p>We'd love to hear from you. Reach out for any enquiry about courses or admission.</p></div></div>
<section class="section"><div class="container grid g2" style="gap:36px;align-items:start">
  <div>
    <h2>Get in touch</h2>
    <ul class="contact-list" id="info"></ul>
    <div id="mapBox" style="margin-top:20px"></div>
  </div>
  <div class="form-card">
    <h3>Send us a message</h3>
    <div id="msgAlert"></div>
    <form id="f" novalidate>
      <input class="hp" type="text" name="website" tabindex="-1" autocomplete="off">
      <div class="fld"><label>Your name <span class="req">*</span></label><input type="text" name="name" required maxlength="120"></div>
      <div class="row"><div class="fld"><label>Email <span class="req">*</span></label><input type="email" name="email" required maxlength="200"></div>
      <div class="fld"><label>Phone</label><input type="tel" name="phone" maxlength="40"></div></div>
      <div class="fld"><label>Message <span class="req">*</span></label><textarea name="message" required maxlength="4000"></textarea></div>
      <button class="btn btn-navy" id="send">Send message</button>
    </form>
  </div>
</div></section>
</main>
<div id="site-footer"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script>
<script>
(async () => {
  const s = await pageInit("contact.html");
  const item = (ic, label, html) => html ? `<li><i>${ic}</i><div><b>${label}</b><br>${html}</div></li>` : "";
  $("#info").innerHTML =
    item("📞", "Phone", s.phone && `<a href="tel:${esc(s.phone.replace(/\s/g, ""))}">${esc(s.phone)}</a>`) +
    item("💬", "WhatsApp", s.whatsapp && `<a target="_blank" rel="noopener" href="https://wa.me/${esc(s.whatsapp.replace(/\D/g, ""))}">${esc(s.whatsapp)}</a>`) +
    item("✉", "Email", s.email && `<a href="mailto:${esc(s.email)}">${esc(s.email)}</a>`) +
    item("📍", "Location", s.address && esc(s.address)) +
    item("🕘", "Office hours", s.office_hours && esc(s.office_hours));
  if (/^https:\/\/(www\.google\.com|maps\.google\.com)\/maps/i.test(s.map_embed_url || ""))
    $("#mapBox").innerHTML = `<iframe class="map" src="${esc(s.map_embed_url)}" loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="BIPS location"></iframe>`;

  $("#f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const f = e.target, d = Object.fromEntries(new FormData(f));
    if (d.website) return; // honeypot
    const bad = !d.name.trim() || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(d.email) || !d.message.trim();
    if (bad) { $("#msgAlert").innerHTML = `<div class="alert alert-err">Please enter your name, a valid email and a message.</div>`; return; }
    const btn = $("#send"); btn.disabled = true; btn.textContent = "Sending…";
    const { error } = await sb.from("contact_messages").insert({ name: d.name.trim(), email: d.email.trim(), phone: d.phone.trim() || null, message: d.message.trim() });
    btn.disabled = false; btn.textContent = "Send message";
    if (error) { $("#msgAlert").innerHTML = `<div class="alert alert-err">Could not send: ${esc(error.message)}</div>`; return; }
    $("#msgAlert").innerHTML = `<div class="alert alert-ok">Thank you! Your message has been sent. We'll get back to you soon.</div>`; f.reset();
  });
})();
</script>
</body></html>
