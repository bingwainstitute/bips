<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Admin Dashboard – BIPS</title>
<link rel="icon" type="image/png" href="assets/favicon.png">
<link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/admin.css">
</head>
<body class="admin">

<div id="loginView" class="login-wrap" style="display:none">
  <div class="login-card">
    <img src="assets/logo.png" alt="BIPS">
    <h2>Admin Login</h2>
    <p class="muted center" style="font-size:.9rem">Authorised staff only</p>
    <div id="loginAlert"></div>
    <form id="loginForm" novalidate>
      <div class="fld"><label>Email</label><input type="email" id="lEmail" autocomplete="username" required></div>
      <div class="fld"><label>Password</label><input type="password" id="lPass" autocomplete="current-password" required></div>
      <button class="btn btn-navy" id="lBtn" style="width:100%">Sign in</button>
    </form>
    <p class="center" style="margin:14px 0 0;font-size:.85rem"><a href="index.html">← Back to website</a></p>
  </div>
</div>

<div id="appView" style="display:none">
  <div class="mnav"><button onclick="document.getElementById('side').classList.toggle('open')">☰</button><b>BIPS Admin</b></div>
  <div class="layout">
    <aside class="side" id="side">
      <div class="logo"><img src="assets/logo.png" alt=""><span><b>BIPS Admin</b><small>Kuwa Bingwa</small></span></div>
      <nav id="nav"></nav>
      <div class="me"><span id="meRole"></span><b id="meEmail"></b>
        <button class="btn btn-outline-light btn-sm" id="logoutBtn" style="margin-top:8px;width:100%">Log out</button>
        <a href="index.html" target="_blank" style="display:block;text-align:center;margin-top:8px;color:#c3d0ea;font-size:.82rem">View website ↗</a></div>
    </aside>
    <main class="main"><div id="view"></div></main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script><script src="js/app.js"></script><script src="js/admin.js"></script>
</body></html>
